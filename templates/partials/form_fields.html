{% for error in form.non_field_errors %}
  <p class="form-error">{{ error }}</p>
{% endfor %}

{% for field in form %}
  <div class="form-row">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}
      <div class="help">{{ field.help_text|safe }}</div>
    {% endif %}
    {% for error in field.errors %}
      <p class="form-error">{{ error }}</p>
    {% endfor %}
  </div>
{% endfor %}
