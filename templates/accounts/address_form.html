{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <div class="form-card">
    <h1>{{ title }}</h1>

    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button type="submit" class="btn">Save address</button>
      <a href="{% url 'accounts:profile' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
